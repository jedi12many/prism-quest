# The boot file (src/boot.s): loads at $0801 with a BASIC SYS line, then
# copies its pieces to where they run.
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    BASIC:    file = %O, start = $0801, size = $1000;
    PAY:      file = "", start = $C540, size = $0AC0;   # the game's overlay window
    CORE1:    file = "", start = $0200, size = $0059;   # (BASIC's input buffer)
    CORE2:    file = "", start = $02A7, size = $0058;   # (free; $02FF: the magic)
    CORE3:    file = "", start = $03E4, size = $0018;   # (the tape buffer's tail)
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = BASIC,    type = ro;
    PAYLOAD:  load = BASIC,    run = PAY,   type = rw, define = yes;
    CORE1:    load = BASIC,    run = CORE1, type = rw, define = yes;
    CORE2:    load = BASIC,    run = CORE2, type = rw, define = yes;
    CORE3:    load = BASIC,    run = CORE3, type = rw, define = yes;
}
