# Prism Quest C64 memory layout (based on cc65's c64.cfg)
#
#   $0334-$03FB  the music player's start/stop (the tape buffer: no tape)
#   $0400-$05EF  scratch: the save buffer, shared with the map view buffers
#   $05F0-$07FF  entity tables (LOWBSS; the KERNAL's old text screen, unused)
#   $0801-$BFDF  resident program: code, read-only data, initialised data,
#                then world.c's variables (WBSS: the scroller)
#   $C000-$C3FF  the map's second screen (the scroller double-buffers). The
#                main file carries the startup code here, which runs in place
#                before the screen is needed (INITCODE), and the tape-buffer
#                code, which main() copies down first
#   $C400-$C53F  the music player's once-a-frame code
#   $C540-$CFFF  the overlay window: PQ.OV1..14 load here on demand
#   $D000-$D7FF  character set   } RAM under the I/O chips. Both ride at the
#   $D800-$DD3F  sprite art      } end of PQ.HI (landing on top of BSS) and are
#                                  copied here at startup with I/O banked out
#   $E000-$E57F  VIC bank 3: screen $E000, sprite slots $E400 (6 used)
#   $E580-$F67F  code + data from the second file, PQ.HI (<output>.hi),
#                which the game loads at startup
#   $F680-$FEFF  BSS (zeroed variables)
#   $FF00-$FF1F  the startup code's variables (PQ.HI's tail lands on BSS)
#   ...  -$FFEF  C stack, >= 208 bytes (main() moves it here; -Cl keeps
#                locals static, so the C stack only carries arguments)
#   $FFFA-$FFFF  NMI/RESET/IRQ vectors
#
# The main file runs contiguously from $0801 to the music code (MAIN is
# padded to its end), so the KERNAL's LOAD puts everything in place.
#
# PQ.HI is one file loaded at $E000: the sprite art first (landing where the
# screen will be), then the HI code, then the charset (landing on BSS). At
# startup unpack_hi() copies the art and charset under the I/O chips and
# clears BSS; only then is the screen set up.
#
# Everything from $E000 up is RAM under the KERNAL ROM, which the game banks
# out at startup ($01 = $35). The startup code only writes there (zeroing BSS),
# and writes always reach the RAM, so that's safe before the switch.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    # the overlay window: PQ.OV1..14 all load here, one at a time
    __OVL_START__:  type = export, value = $C540;
    __OVL_SIZE__:   type = export, value = $0AC0;
    __LOADADDR__:   type = import;
    __EXEHDR__:     type = import;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    # MAIN ends 32 bytes short of $C000 (the second screen): crt0 points the C stack at $BFF0
    # and pushes argc/argv before main() can move it. Padded to its end, and on through
    # the second screen, so the startup and music code after it load where they run.
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - $20 - __HEADER_LAST__, fill = yes;
    GAP:      file = %O,               start = $BFE0,           size = $0020, fill = yes;
    STARTUP:  file = %O,               start = $C000,           size = $03E8, fill = yes;   # (below the sprite pointers)
    GAP2:     file = %O,               start = $C3E8,           size = $0018, fill = yes;
    MUSRAM:   file = %O,               start = $C400,           size = __OVL_START__ - $C400;
    CASS:     file = "",               start = $0334,           size = $00C8;   # (no tape: free)
    OV1HDR:   file = "%O.1", start = __OVL_START__ - 2, size = $0002;
    OV1:      file = "%O.1", start = __OVL_START__, size = __OVL_SIZE__;
    OV2HDR:   file = "%O.2", start = __OVL_START__ - 2, size = $0002;
    OV2:      file = "%O.2", start = __OVL_START__, size = __OVL_SIZE__;
    OV3HDR:   file = "%O.3", start = __OVL_START__ - 2, size = $0002;
    OV3:      file = "%O.3", start = __OVL_START__, size = __OVL_SIZE__;
    OV4HDR:   file = "%O.4", start = __OVL_START__ - 2, size = $0002;
    OV4:      file = "%O.4", start = __OVL_START__, size = __OVL_SIZE__;
    OV5HDR:   file = "%O.5", start = __OVL_START__ - 2, size = $0002;
    OV5:      file = "%O.5", start = __OVL_START__, size = __OVL_SIZE__;
    OV6HDR:   file = "%O.6", start = __OVL_START__ - 2, size = $0002;
    OV6:      file = "%O.6", start = __OVL_START__, size = __OVL_SIZE__;
    OV7HDR:   file = "%O.7", start = __OVL_START__ - 2, size = $0002;
    OV7:      file = "%O.7", start = __OVL_START__, size = __OVL_SIZE__;
    OV8HDR:   file = "%O.8", start = __OVL_START__ - 2, size = $0002;
    OV8:      file = "%O.8", start = __OVL_START__, size = __OVL_SIZE__;
    OV9HDR:   file = "%O.9", start = __OVL_START__ - 2, size = $0002;
    OV9:      file = "%O.9", start = __OVL_START__, size = __OVL_SIZE__;
    OV10HDR:  file = "%O.10", start = __OVL_START__ - 2, size = $0002;
    OV10:     file = "%O.10", start = __OVL_START__, size = __OVL_SIZE__;
    OV11HDR:  file = "%O.11", start = __OVL_START__ - 2, size = $0002;
    OV11:     file = "%O.11", start = __OVL_START__, size = __OVL_SIZE__;
    OV12HDR:  file = "%O.12", start = __OVL_START__ - 2, size = $0002;
    OV12:     file = "%O.12", start = __OVL_START__, size = __OVL_SIZE__;
    OV13HDR:  file = "%O.13", start = __OVL_START__ - 2, size = $0002;
    OV13:     file = "%O.13", start = __OVL_START__, size = __OVL_SIZE__;
    OV14HDR:  file = "%O.14", start = __OVL_START__ - 2, size = $0002;
    OV14:     file = "%O.14", start = __OVL_START__, size = __OVL_SIZE__;
    LOWRAM:   file = "",               start = $05F0,           size = $0210;
    HIBSS:    file = "",               start = $F680,           size = $0880;
    EARLY:    file = "",               start = $FF00,           size = $0020;   # (above PQ.HI's end)
    HIHDR:    file = "%O.hi",          start = $DFFE,           size = $0002;
    HISPRLD:  file = "%O.hi",               start = $E000,      size = $0580, fill = yes;
    HI:       file = "%O.hi", define = yes, start = $E580,      size = $1100, fill = yes;
    HICHRLD:  file = "%O.hi",               start = $F680,      size = $0960;
    CHRRAM:   file = "",                    start = $D000,      size = $0800;
    SPRRAM:   file = "",                    start = $D800,      size = $0600;   # (the rain's frames from $DE00)
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    WBSS:     load = MAIN,     type = bss, define   = yes;   # world.c's variables (main() zeroes them)
    CASSCODE: load = STARTUP,  run = CASS,  type = ro, define = yes;
    INITCODE: load = STARTUP,  type = ro;
    MUSCODE:  load = MUSRAM,   type = ro;
    BSS:      load = HIBSS,    type = bss, define   = yes;
    EARLYBSS: load = EARLY,    type = bss;   # used before unpack_hi has moved PQ.HI's tail off BSS
    LOWBSS:   load = LOWRAM,   type = bss, define   = yes;
    OV1LOAD:  load = OV1HDR, type = ro;
    OV1SIG:   load = OV1, type = ro;
    OVTITLECODE: load = OV1, type = ro, optional = yes;
    OVTITLEDATA: load = OV1, type = ro, optional = yes;
    OV2LOAD:  load = OV2HDR, type = ro;
    OV2SIG:   load = OV2, type = ro;
    OVTALKACODE: load = OV2, type = ro, optional = yes;
    OVTALKADATA: load = OV2, type = ro, optional = yes;
    OV3LOAD:  load = OV3HDR, type = ro;
    OV3SIG:   load = OV3, type = ro;
    OVTALKBCODE: load = OV3, type = ro, optional = yes;
    OVTALKBDATA: load = OV3, type = ro, optional = yes;
    OV4LOAD:  load = OV4HDR, type = ro;
    OV4SIG:   load = OV4, type = ro;
    OVCAMPCODE: load = OV4, type = ro, optional = yes;
    OVCAMPDATA: load = OV4, type = ro, optional = yes;
    OV5LOAD:  load = OV5HDR, type = ro;
    OV5SIG:   load = OV5, type = ro;
    OVTREE0CODE: load = OV5, type = ro, optional = yes;
    OVTREE0DATA: load = OV5, type = ro, optional = yes;
    OV6LOAD:  load = OV6HDR, type = ro;
    OV6SIG:   load = OV6, type = ro;
    OVTREE1CODE: load = OV6, type = ro, optional = yes;
    OVTREE1DATA: load = OV6, type = ro, optional = yes;
    OV7LOAD:  load = OV7HDR, type = ro;
    OV7SIG:   load = OV7, type = ro;
    OVTREE2CODE: load = OV7, type = ro, optional = yes;
    OVTREE2DATA: load = OV7, type = ro, optional = yes;
    OV8LOAD:  load = OV8HDR, type = ro;
    OV8SIG:   load = OV8, type = ro;
    OVBUILDCODE: load = OV8, type = ro, optional = yes;
    OVBUILDDATA: load = OV8, type = ro, optional = yes;
    OV9LOAD:  load = OV9HDR, type = ro;
    OV9SIG:   load = OV9, type = ro;
    OVLEDGERCODE: load = OV9, type = ro, optional = yes;
    OVLEDGERDATA: load = OV9, type = ro, optional = yes;
    OV10LOAD: load = OV10HDR, type = ro;
    OV10SIG:  load = OV10, type = ro;
    OVDUNGEONCODE: load = OV10, type = ro, optional = yes;
    OVDUNGEONDATA: load = OV10, type = ro, optional = yes;
    OV11LOAD: load = OV11HDR, type = ro;
    OV11SIG:  load = OV11, type = ro;
    OVLANDSCODE: load = OV11, type = ro, optional = yes;
    OVLANDSDATA: load = OV11, type = ro, optional = yes;
    OV12LOAD: load = OV12HDR, type = ro;
    OV12SIG:  load = OV12, type = ro;
    OVDIGCODE: load = OV12, type = ro, optional = yes;
    OVDIGDATA: load = OV12, type = ro, optional = yes;
    OV13LOAD: load = OV13HDR, type = ro;
    OV13SIG:  load = OV13, type = ro;
    OVGLASSCODE: load = OV13, type = ro, optional = yes;
    OVGLASSDATA: load = OV13, type = ro, optional = yes;
    OV14LOAD: load = OV14HDR, type = ro;
    OV14SIG:  load = OV14, type = ro;
    OVPACTCODE: load = OV14, type = ro, optional = yes;
    OVPACTDATA: load = OV14, type = ro, optional = yes;
    HILOAD:   load = HIHDR,    type = ro;
    HISIG:    load = HI,       type = ro;
    HICODE:   load = HI,       type = ro,  optional = yes;
    HIDATA:   load = HI,       type = ro,  optional = yes;
    HISPR:    load = HISPRLD,  run = SPRRAM, type = ro, define = yes;
    HICHR:    load = HICHRLD,  run = CHRRAM, type = ro, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
