# Prism Quest C64 memory layout (based on cc65's c64.cfg)
#
#   $0400-$05EF  scratch: the save buffer, shared with the map view buffers
#   $05F0-$07FF  entity tables (LOWBSS; the KERNAL's old text screen, unused)
#   $0801-$CFEF  program, read-only data, initialised data
#   $D000-$D7FF  character set   } RAM under the I/O chips. Both ride at the
#   $D800-$DD3F  sprite art      } end of PQ.HI (landing on top of BSS) and are
#                                  copied here at startup with I/O banked out
#   $E000-$E57F  VIC bank 3: screen $E000, sprite slots $E400 (6 used)
#   $E580-$F67F  code + data from the second file, PQ.HI (<output>.hi),
#                which the game loads at startup
#   $F680-$FF0x  BSS (zeroed variables)
#   ...  -$FFEF  C stack, >= 208 bytes (main() moves it here; -Cl keeps
#                locals static, so the C stack only carries arguments)
#   $FFFA-$FFFF  NMI/RESET/IRQ vectors
#
# PQ.HI is one file loaded at $E000: the sprite art first (landing where the
# screen will be), then the HI code, then the charset (landing on BSS). At
# startup unpack_hi() copies the art and charset under the I/O chips and
# clears BSS; only then is the screen set up.
#
# Everything from $E000 up is RAM under the KERNAL ROM, which the game banks
# out at startup ($01 = $35). The startup code only writes there (zeroing BSS),
# and writes always reach the RAM, so that's safe before the switch.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:   type = import;
    __EXEHDR__:     type = import;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    # end 16 bytes short of $D000: crt0 points the C stack at the end of MAIN
    # and pushes argc/argv before main() can move it
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $CFF0 - __HEADER_LAST__;
    LOWRAM:   file = "",               start = $05F0,           size = $0210;
    HIBSS:    file = "",               start = $F680,           size = $08A0;
    HIHDR:    file = "%O.hi",          start = $DFFE,           size = $0002;
    HISPRLD:  file = "%O.hi",               start = $E000,      size = $0580, fill = yes;
    HI:       file = "%O.hi", define = yes, start = $E580,      size = $1100, fill = yes;
    HICHRLD:  file = "%O.hi",               start = $F680,      size = $0960;
    CHRRAM:   file = "",                    start = $D000,      size = $0800;
    SPRRAM:   file = "",                    start = $D800,      size = $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = HIBSS,    type = bss, define   = yes;
    LOWBSS:   load = LOWRAM,   type = bss, define   = yes;
    HILOAD:   load = HIHDR,    type = ro;
    HISIG:    load = HI,       type = ro;
    HICODE:   load = HI,       type = ro,  optional = yes;
    HIDATA:   load = HI,       type = ro,  optional = yes;
    HISPR:    load = HISPRLD,  run = SPRRAM, type = ro, define = yes;
    HICHR:    load = HICHRLD,  run = CHRRAM, type = ro, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
